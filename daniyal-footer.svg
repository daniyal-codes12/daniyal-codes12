<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="100" viewBox="0 0 1000 100" role="img" aria-labelledby="title">
  <title id="title">Keep learning, keep building, keep growing</title>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".1"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity=".1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="98" rx="16" fill="#0A1020" stroke="#1E3A5F"/>
  <path d="M25 25 H975" stroke="url(#line)" stroke-width="2"/>
  <text x="500" y="59" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#E0F2FE">KEEP LEARNING  •  KEEP BUILDING  •  KEEP GROWING</text>
  <path d="M25 76 H975" stroke="url(#line)" stroke-width="2"/>
</svg>
