<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Daniyal Channa — Software Engineering Student</title>
  <desc id="desc">A dark navy technology banner with animated blue and cyan gradients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0B1730"/>
      <stop offset="100%" stop-color="#10102A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".1"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity=".1"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#38BDF8" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <path d="M0 275 C240 210 360 360 620 265 S980 170 1200 230 L1200 340 L0 340 Z" fill="#123B7A" opacity=".22"/>
  <path d="M0 288 C240 220 400 355 650 265 S990 180 1200 225" fill="none" stroke="url(#shine)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke-dasharray" values="0 1800;700 1100;0 1800" dur="8s" repeatCount="indefinite"/>
  </path>
  <path d="M70 55 L92 55 L62 105 L40 105 Z" fill="#2563EB"/>
  <path d="M95 55 L108 55 L78 105 L65 105 Z" fill="#22D3EE" opacity=".8"/>
  <circle cx="1060" cy="78" r="54" fill="none" stroke="#38BDF8" stroke-opacity=".35" stroke-width="1.5"/>
  <circle cx="1060" cy="78" r="38" fill="none" stroke="#818CF8" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="0 1060 78" to="360 1060 78" dur="24s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1097" cy="51" r="5" fill="#67E8F9" filter="url(#glow)"/>
  <text x="78" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="5" fill="#67E8F9">HELLO, WORLD! I'M</text>
  <text x="74" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="800" letter-spacing="1" fill="#F8FAFC">DANIYAL <tspan fill="#38BDF8">CHANNA</tspan></text>
  <rect x="78" y="225" width="405" height="3" rx="2" fill="url(#shine)"/>
  <text x="78" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#D7E7FF">SOFTWARE ENGINEERING STUDENT</text>
  <text x="78" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="2" fill="#94A3B8">WEB DEVELOPMENT  •  VIBE CODING  •  AI-ASSISTED DEVELOPMENT</text>
  <g fill="#38BDF8" opacity=".85">
    <circle cx="1000" cy="210" r="3"/><circle cx="1032" cy="230" r="2"/><circle cx="1090" cy="197" r="3"/>
    <circle cx="1130" cy="245" r="2"/><circle cx="1057" cy="267" r="2"/>
  </g>
</svg>
